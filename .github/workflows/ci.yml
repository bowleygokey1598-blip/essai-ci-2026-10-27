name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: >
          node --disable-warning=ExperimentalWarning --test --experimental-test-coverage
          --test-coverage-include='src/devis/**'
          --test-coverage-lines=80 --test-coverage-branches=80
